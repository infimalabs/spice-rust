[package]
name = "gate"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic = { path = "../atomic" }
gix-glob = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
sill = { path = "../sill" }
toml = { version = "1.1.4", default-features = false, features = [
    "parse",
    "display",
    "preserve_order",
    "serde",
    "std",
] }
wire = { path = "../wire" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gix = { version = "0.86.0", default-features = false, features = ["index", "revision", "sha1"] }

[dev-dependencies]
syn = { version = "3.0.3", features = ["full", "visit"] }

[lints]
workspace = true
