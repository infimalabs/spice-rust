release = "0.31.0"

[[cases]]
gate = "merge-integrity"
kind = "pass"
source = "spice/hooks/precommit.py::_merge_integrity_diagnostic"
observation = "MERGE_HEAD, staged tree, HEAD tree, merge-tree result and conflicted paths"
expected = "passed"
diagnostic = "no merge in progress"

[[cases]]
gate = "merge-integrity"
kind = "fail"
source = "spice/hooks/precommit.py::_merge_integrity_diagnostic"
observation = "MERGE_HEAD, staged tree, HEAD tree, merge-tree result and conflicted paths"
expected = "failed"
diagnostic = "empty merge refused"

[[cases]]
gate = "merge-integrity"
kind = "staged-pass"
source = "spice/hooks/precommit.py::_merge_integrity_diagnostic"
observation = "MERGE_HEAD, staged tree, HEAD tree, merge-tree result and conflicted paths"
expected = "passed"
diagnostic = "staged tree"

[[cases]]
gate = "merge-integrity"
kind = "same-tree-pass"
source = "spice/hooks/precommit.py::_merge_integrity_diagnostic"
observation = "MERGE_HEAD, staged tree, HEAD tree, merge-tree result and conflicted paths"
expected = "passed"
diagnostic = "merge-tree result equals HEAD"

[[cases]]
gate = "merge-integrity"
kind = "conflicted-fail"
source = "spice/hooks/precommit.py::_merge_integrity_diagnostic"
observation = "MERGE_HEAD, staged tree, HEAD tree, merge-tree result and conflicted paths"
expected = "failed"
diagnostic = "discarded merge is conflicted at: spice/src/lib.rs"

[[cases]]
gate = "merge-integrity"
kind = "unnamed-conflict-fail"
source = "spice/hooks/precommit.py::_merge_integrity_diagnostic"
observation = "MERGE_HEAD, staged tree, HEAD tree, merge-tree result and conflicted paths"
expected = "failed"
diagnostic = "git merge-tree did not name the conflicted paths"

[[cases]]
gate = "plan-phase"
kind = "pass"
source = "spice/hooks/precommit.py::_run_plan_phase_mutation_guard"
observation = "Taskwarrior availability and active claimed task phase"
expected = "passed"
diagnostic = "no active claim"

[[cases]]
gate = "plan-phase"
kind = "fail"
source = "spice/hooks/precommit.py::_run_plan_phase_mutation_guard"
observation = "Taskwarrior availability and active claimed task phase"
expected = "failed"
diagnostic = "still in plan phase"

[[cases]]
gate = "repo-shape"
