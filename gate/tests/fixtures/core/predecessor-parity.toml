source = "spice/hooks/precommit.py::_run_shape_guards"
observation = "package roots, generated paths, namespace, path-shape and name-cluster findings"
expected = "passed"
diagnostic = "repo shape: ok"

[[cases]]
gate = "repo-shape"
kind = "fail"
source = "spice/hooks/precommit.py::_run_shape_guards"
observation = "package roots, generated paths, namespace, path-shape and name-cluster findings"
expected = "failed"
diagnostic = "repository shape violations"

[[cases]]
gate = "staging"
kind = "pass"
source = "spice/hooks/precommit.py::_run_staging_guard"
observation = "intersection of staged and unstaged repository paths"
expected = "passed"
diagnostic = "no partially staged files"

[[cases]]
gate = "staging"
kind = "fail"
source = "spice/hooks/precommit.py::_run_staging_guard"
observation = "intersection of staged and unstaged repository paths"
expected = "failed"
diagnostic = "partially staged files"

