[package]
name = "app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1.0.229"
thiserror = "2.0.19"
wire = { path = "../wire" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3.33"
futures-channel = "0.3.33"
gloo-net = "0.6.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "0.3.83"
serde_json = "1.0.151"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = ["Blob", "BlobPropertyBag", "Crypto", "Document", "Element", "Event", "HtmlAudioElement", "HtmlElement", "HtmlInputElement", "HtmlMediaElement", "HtmlTextAreaElement", "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice", "Url", "Window"] }
yew = { version = "0.21.0", features = ["csr"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
