[package]
name = "app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1.0.229"
thiserror = "2.0.19"
wire = { path = "../wire" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22.1"
futures-util = "0.3.33"
futures-channel = "0.3.33"
gloo-net = "0.6.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "0.3.83"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = ["AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "ClipboardEvent", "Crypto", "CssStyleDeclaration", "DataTransfer", "Document", "DomRect", "DragEvent", "Element", "Event", "File", "FileList", "FileReader", "HtmlAudioElement", "HtmlElement", "HtmlIFrameElement", "HtmlImageElement", "HtmlInputElement", "HtmlMediaElement", "HtmlTextAreaElement", "Location", "MessageEvent", "MutationObserver", "MutationObserverInit", "NodeList", "ProgressEvent", "ResizeObserver", "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice", "Storage", "Url", "Window"] }
yew = { version = "0.21.0", features = ["csr"] }

[dev-dependencies]
futures-channel = "0.3.33"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
