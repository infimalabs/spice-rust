[package]
name = "fold"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.spice.cargo-proof]
version = 1
complete = true
calls = [
    ".any",
    ".as_str",
    ".contains",
    ".insert",
    ".into",
    ".is_empty",
    ".is_some_and",
    ".iter",
    ".starts_with",
    ".strip_suffix",
    ".write_str",
    "BTreeSet::new",
    "Err",
    "Ok",
    "Refusal::new",
    "Self",
    "admission::validate",
    "pattern_matches",
    "validate_rows",
    "validate_sources",
]

[dependencies]
journal = { path = "../journal" }
serde_json = "1.0.151"
wire = { path = "../wire" }

[build-dependencies]
wire = { path = "../wire" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }

[lints]
workspace = true
