[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic = { path = "../atomic" }
dist = { path = "../dist" }
gate = { path = "../gate" }
getrandom = "0.3.4"
hosted-windows = { path = "../hosted-windows" }
proof = { path = "../proof" }
jiff = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sill = { path = "../sill" }
spice = { path = "../spice" }
toml = "1.1.4"
windows-guest = { path = "../windows-guest" }
wire = { path = "../wire" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
signal-hook = "0.3.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lints]
workspace = true
