[package]
name = "canvas"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic = { path = "../atomic" }
bus = { path = "../bus" }
fold = { path = "../fold" }
journal = { path = "../journal" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wire = { path = "../wire" }

[dev-dependencies]
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53.1", features = ["time"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.4"
tungstenite = "0.29.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "tokio", "ws"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.14", default-features = false, features = ["rt"] }

[lints]
workspace = true
