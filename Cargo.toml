[workspace]
members = [
    "app",
    "artifact",
    "atomic",
    "board",
    "bus",
    "serve",
    "canvas",
    "consent",
    "desktop",
    "dialect",
    "dist",
    "door",
    "gate",
    "hosted-windows",
    "journal",
    "lane",
    "listen",
    "proof",
    "sill",
    "spice",
    "steer",
    "tape",
    "taste",
    "vendor",
    "wire",
    "windows-guest",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

# One deflate implementation for every crate: canvas archive bytes are a pure
# function of their inputs only while every build compresses through this
# backend.
[workspace.dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
warnings = "deny"
unfulfilled_lint_expectations = "deny"
# rust-analyzer sets `rust_analyzer` while analysing the host target; App
# browser gates admit it so the Wasm-only modules stay navigable.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(rust_analyzer)"] }

[workspace.lints.clippy]
all = "deny"
disallowed_methods = "deny"

# Keep line-level diagnostics while avoiding full variable debug information in
# ordinary development artifacts. Self-hosted Spice and Gate builds inherit the
# unoptimized development profile for a short edit/build/install loop. The
# installed development appliance remains stripped because every hook
# authenticates and copies its complete bytes; release assembly selects its
# independently optimized profile with `--release`. Test builds keep every
# workspace crate unoptimized, wire included, because each package's test
# shard resolves its own dependency features and so recompiles shared crates;
# only the small third-party hashing hotspots stay optimized in that profile.
[profile.dev]
debug = 1

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.wire]
opt-level = 3

[profile.dev.package.spice]
strip = "symbols"

# Test executables carry no debug information. On macOS debug information stays
# in each codegen unit's object file beside the executable, and Cargo never
# removes the objects a relink stops referencing, so test debug information
# would grow each lane's output with every edit. A panic still reports its
# source location without it.
[profile.test]
debug = 0

[profile.test.package.blake3]
opt-level = 3

[profile.test.package.sha1]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.test.package.wire]
opt-level = 0

[profile.test.package.gate]
opt-level = 0

[profile.test.package.spice]
opt-level = 0
strip = "none"
