[workspace]
members = [
    "app",
    "artifact",
    "atomic",
    "board",
    "bus",
    "serve",
    "consent",
    "dialect",
    "dist",
    "gate",
    "journal",
    "lane",
    "listen",
    "proof",
    "sill",
    "spice",
    "steer",
    "tape",
    "taste",
    "vendor",
    "wire",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
warnings = "deny"
unfulfilled_lint_expectations = "deny"
# rust-analyzer sets `rust_analyzer` while analysing the host target; App
# browser gates admit it so the Wasm-only modules stay navigable.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(rust_analyzer)"] }

[workspace.lints.clippy]
all = "deny"
disallowed_methods = "deny"

# Keep line-level diagnostics while avoiding full variable debug information in
# ordinary development artifacts. Self-hosted Spice and Gate builds inherit the
# unoptimized development profile for a short edit/build/install loop. The
# installed development appliance remains stripped because every hook
# authenticates and copies its complete bytes; release assembly selects its
# independently optimized profile with `--release`. Test builds likewise keep
# the large gate and Spice crates
# unoptimized so a fresh selected-tree path stays inside the canonical
# workspace-test shard deadline; only the small hashing and wire hotspots stay
# optimized in that profile.
[profile.dev]
debug = 1

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.wire]
opt-level = 3

[profile.dev.package.spice]
strip = "symbols"

[profile.test]
debug = 1

[profile.test.package.blake3]
opt-level = 3

[profile.test.package.sha1]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.test.package.wire]
opt-level = 3

[profile.test.package.gate]
opt-level = 0

[profile.test.package.spice]
opt-level = 0
strip = "none"
