[workspace]
members = [
    "app",
    "atomic",
    "board",
    "bus",
    "canvas",
    "consent",
    "dialect",
    "dist",
    "fold",
    "gate",
    "journal",
    "lane",
    "listen",
    "proof",
    "sill",
    "spice",
    "steer",
    "tape",
    "taste",
    "vendor",
    "wire",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
warnings = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = "deny"
