[workspace]
members = [
    "app",
    "artifact",
    "atomic",
    "board",
    "bus",
    "canvas",
    "consent",
    "dialect",
    "dist",
    "gate",
    "journal",
    "lane",
    "listen",
    "proof",
    "sill",
    "spice",
    "steer",
    "tape",
    "taste",
    "vendor",
    "wire",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
warnings = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
all = "deny"
disallowed_methods = "deny"

# Keep line-level diagnostics while avoiding full variable debug information in
# ordinary development artifacts. The repeatedly executed self-hosted Spice
# development binary is optimized and stripped because every installed hook
# authenticates its complete bytes. Test builds keep the large gate and Spice
# crates unoptimized so a fresh selected-tree path stays inside the canonical
# workspace-test shard deadline; only the small hashing and wire hotspots stay
# optimized in that profile.
[profile.dev]
debug = 1

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.wire]
opt-level = 3

[profile.dev.package.gate]
opt-level = 3

[profile.dev.package.spice]
opt-level = 3
strip = "symbols"

[profile.test]
debug = 1

[profile.test.package.blake3]
opt-level = 3

[profile.test.package.sha1]
opt-level = 3

[profile.test.package.wire]
opt-level = 3

[profile.test.package.gate]
opt-level = 0

[profile.test.package.spice]
opt-level = 0
strip = "none"
