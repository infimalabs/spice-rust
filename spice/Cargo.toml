[package]
name = "spice"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic = { path = "../atomic" }
board = { path = "../board" }
bus = { path = "../bus" }
canvas = { path = "../canvas" }
clap = "4.6.5"
consent = { path = "../consent" }
dialect = { path = "../dialect" }
fold = { path = "../fold" }
gate = { path = "../gate" }
journal = { path = "../journal" }
lane = { path = "../lane" }
listen = { path = "../listen" }
proof = { path = "../proof" }
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
sill = { path = "../sill" }
steer = { path = "../steer" }
tape = { path = "../tape" }
taste = { path = "../taste" }
toml = { version = "1.1.4", features = ["preserve_order"] }
vendor = { path = "../vendor" }
wire = { path = "../wire" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gix-config = "0.59.0"
jiff = "0.2.35"
notify = "8.2.0"
signal-hook = "0.3.18"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync"] }
tungstenite = "0.29.0"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"

[lints]
workspace = true
