[package]
name = "spice"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = []
# Resolves the canvas archive the linked object defines; only the release
# target build and `spice dev xtask -- install` enable it and link that object.
canvas = ["dep:canvas"]
test-short-horizons = []

[[bin]]
name = "spice"
path = "src/main.rs"

[dependencies]
artifact = { path = "../artifact" }
atomic = { path = "../atomic" }
base64 = "0.22.1"
blake3 = "1.8.5"
board = { path = "../board" }
bus = { path = "../bus" }
canvas = { path = "../canvas", optional = true }
serve = { path = "../serve" }
clap = { version = "4.6.5", features = ["string"] }
consent = { path = "../consent" }
desktop = { path = "../desktop" }
dialect = { path = "../dialect" }
dist = { path = "../dist" }
door = { path = "../door" }
flate2.workspace = true
gate = { path = "../gate" }
jiff = "0.2.35"
journal = { path = "../journal" }
lane = { path = "../lane" }
listen = { path = "../listen" }
proof = { path = "../proof" }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha1 = "0.10.7"
sha2 = "0.10.9"
shell-words = "1.1.1"
sill = { path = "../sill" }
steer = { path = "../steer" }
tape = { path = "../tape" }
taste = { path = "../taste" }
toml = { version = "1.1.4", features = ["preserve_order"] }
vendor = { path = "../vendor" }
wire = { path = "../wire" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gix = { version = "0.86.0", default-features = false, features = ["revision", "sha1"] }
gix-config = "0.59.0"
libc = "0.2.189"
notify = "8.2.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
signal-hook = "0.3.18"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tungstenite = "0.29.0"
uuid = { version = "1.24.0", features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["fs", "process"] }
socket2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
gix = { version = "0.86.0", default-features = false, features = ["tree-editor"] }

[lints]
workspace = true
