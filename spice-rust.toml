# Tracked repository policy owned by Rust Spice. Every active entry is admitted
# through Rust Spice's typed configuration registry and compiled Gate.

[wrappers]
# Agent-authored `spice` commands stay on the repository-local Rust appliance.
# The runtime resolves this declarative reference beneath the Git-common
# directory and refuses redirected, escaping, or non-executable installed
# commands.
spice = "appliance"

[tasks]
# Public scheduler stems beyond the packaged `task` and `serve` defaults.
# Product work routes directly by ownership so the allocator can retain domain
# locality instead of collapsing every crate under one `task` bucket.
#
# The dependency lattice owns the workspace inventory. Every product member is
# present below except `xtask`: it is the verification launcher for `gate`, not
# a second verification domain. `doctrine` owns settled repository law;
# `scheduler` owns the task-plane topology; `rim` owns the cross-crate command,
# exit, and environment edge; and `corpus` owns fixture bodies replayed across
# multiple crates.
#
# One sense keeps one name. Work formerly described as `release`, `studies`,
# `mail`, `lifecycle`, or `hooks` routes to its current owner (`dist`, `gate`,
# `steer`, or `lane`). `cli` and `tests` remain `rim` and `corpus`. Generic
# activity/history labels such as `docs`, `config`, `toolchain`, and `spec` do
# not become scheduler domains; they route to the organ whose contract moves.
stems = [
    "app",
    "atomic",
    "board",
    "bus",
    "canvas",
    "consent",
    "corpus",
    "dialect",
    "dist",
    "doctrine",
    "fold",
    "gate",
    "journal",
    "lane",
    "listen",
    "proof",
    "rim",
    "scheduler",
    "sill",
    "spice",
    "steer",
    "tape",
    "taste",
    "vendor",
    "wire",
]

# A stem names the domain that owns the work, never the work itself. Every
# project therefore takes a child segment saying what moves inside that domain,
# with a third available when a child needs to subdivide. A bare stem would let
# a domain accumulate rows that are distinguishable only by handle, which is the
# same undifferentiated bucket the stem inventory above exists to break up.
project_min_depth = 2
project_max_depth = 3

[vendor.omp]
# OMP lanes merge `.omp/lsp.json` into its built-in workspace server
# definitions; each lane keeps the selected server in its supervised process.
lsp = true

[judge]
# Adjudicate maxim trigger candidates before they become lane direction.
enabled = true

[policy]
# The installed Rust hook reaches this source tree's current gate through the
# exact Git-common appliance and its private dev-Cargo lifecycle rather than
# ambient Cargo. The configured-command trust boundary keeps this exact argv
# inert until an operator grants the digest of these tracked bytes.
pre_commit_builtins = false
pre_commit = [
    { label = "Spice source gate", run = ["spice", "dev", "cargo", "--", "run", "--quiet", "--locked", "--package", "spice", "--bin", "spice", "--", "gate", "selection"] },
]

# The native Git publisher runs this cheap repository load over every
# synthesized integration before it can reach the shared baseline.
admission = [
    "cargo", "metadata", "--no-deps", "--offline", "--format-version", "1",
]

# Installed packaged gates run no test process unless the repository names a
# compiled engine. This source enables the canonical Cargo workspace selector;
# repository data cannot replace its executable or argument contract.
test_engines = ["cargo-workspace"]

# Upstream-generated Mermaid 12.0.0 ESM and its generated provenance index.
# The handwritten renderer-000.mjs bridge and every license remain measured.
# Exact upstream members and checksums: app/renderer/renderer-000.txt.
generated_paths = [
    "app/renderer/renderer-00[1-9].mjs",
    "app/renderer/renderer-0[1-9][0-9].mjs",
    "app/renderer/renderer-10[0-5].mjs",
    "app/renderer/renderer-000.txt",
]

# Every environment name this workspace defines, spelled once.
#
# This is the workspace's own vocabulary: the names Spice writes and the names
# Spice reads back. Gate matches it against the tracked tree in both
# directions, so a name used without being listed fails, and a name listed
# after its last use fails too. That is what makes the vocabulary countable
# rather than a set of literals accumulating across crates.
#
# Session forensics reads the live omp session identity and the selected
# agent vendor. `steer` owns the four hook/session names. The configured commit
# executor owns the staged-path JSON and source-digest handoff names, while the
# installed pre-commit launcher owns its appliance marker. A supervised launch
# separates the installed outer shell from the native shell restored by its
# inner stage, while resident delivery reads the lane's authenticated journal
# inbox and lane-bound commands carry that lane identity. `gate` owns the
# mutation seed and attempt number it repeats into every bounded cargo-mutants
# process. Its hygiene acquisition fixture passes the captured repository and
# marker to an isolated copy of the current test process, and fixes `TMPDIR` at
# private writable scratch so that isolation remains valid on a read-only proof
# host.
#
# Foreign environment names are admitted here. Rust's configured-command
# executor strips Git's three local-environment names before it execs an exact
# configured argv, and the hooks fixture exports exactly those three to prove
# the child sees none of them. The Git shadow writes three more, and it is
# production rather than a fixture: it points `GIT_CONFIG_SYSTEM` at the
# per-worktree config it
# publishes, counts the command-scope pairs it appends in `GIT_CONFIG_COUNT`,
# and sets `GIT_EDITOR` to `echo` for the one probe that asks Git to print its
# own system config path. The hygiene acquisition fixture fixes the seventh,
# `TMPDIR`, at its own writable scratch. Spice
# owns none of these names; the tree either writes or deliberately observes
# them. RTK's upstream `RTK_DB_PATH` is likewise foreign: Rust selects its
# lane-scoped value but does not own the companion's variable. The ledger
# accounts what the tree references rather than what it
# invented, so they are counted here; the
# shadow's indexed
# `GIT_CONFIG_KEY_` and `GIT_CONFIG_VALUE_` pairs are not, because a ledger
# name is a whole name and a trailing underscore is a prefix. Their access
# waiver is a separate arm and does not account them; a waived name is still a
# name, and one written without being counted here is one nobody can find
# again. Doctor reports only the typed Spice variables, so these names are the
# difference wire pins between this manifest and SpiceVariable. The `SPICE_RS_`
# rows are this runtime's live handoff names; the predecessor `SPICE_` rows are
# retained only as coexistence sentinels. The predecessor's self-exec root and
# staged-path handoff are likewise observed operational context, not variables
# this runtime owns.
# Keep the environment ledger ordered by serialized name for reviewable diffs.
env_names = [
    "BASH_ENV",
    "GIT_CONFIG_COUNT",
    "GIT_CONFIG_SYSTEM",
    "GIT_DIR",
    "GIT_EDITOR",
    "GIT_INDEX_FILE",
    "GIT_WORK_TREE",
    "RTK_DB_PATH",
    "SPICE_AGENT_VENDOR",
    "SPICE_APP_SOURCE_IDENTITY",
    "SPICE_COMMAND_PLAN_EXECUTION_DIGEST",
    "SPICE_FIXTURE_RERUN",
    "SPICE_HOOKS",
    "SPICE_HOOK_ARGV_LOG",
    "SPICE_HOOK_EXIT_CODE",
    "SPICE_HOOK_STDIN_LOG",
    "SPICE_HYGIENE_ACQUIRE_REPOSITORY",
    "SPICE_HYGIENE_INTERPRETER_MARKER",
    "SPICE_INSTALL_TEST_EXECUTABLE",
    "SPICE_LANE",
    "SPICE_MOUNTED_COMMAND",
    "SPICE_MUTATION_ATTEMPT",
    "SPICE_MUTATION_SEED",
    "SPICE_NATIVE_PINS",
    "SPICE_NATIVE_SHELL",
    "SPICE_PRE_COMMIT_PARENT_TEST_ROLE",
    "SPICE_PRE_COMMIT_PARENT_TEST_ROOT",
    "SPICE_PRE_COMMIT_PARENT_TEST_SOCKET",
    "SPICE_PROOF",
    "SPICE_RS_BOOTSTRAP_CARGO_HOME",
    "SPICE_RS_HOOKS",
    "SPICE_RS_LANE",
    "SPICE_RS_NATIVE_CARGO",
    "SPICE_RS_NATIVE_RUSTC",
    "SPICE_RS_NATIVE_RUSTDOC",
    "SPICE_RS_NATIVE_SHELL",
    "SPICE_RS_PRE_COMMIT_PATHS",
    "SPICE_RS_PRE_COMMIT_SOURCE",
    "SPICE_RS_RTK_EXECUTABLE",
    "SPICE_RS_SESSION",
    "SPICE_RS_WRAPPER_SPICE",
    "SPICE_RUNTIME_PYTHON",
    "SPICE_SELFEXEC_ROOT",
    "SPICE_SHELL_HOOK_INSTALLED_APPLIANCE",
    "SPICE_SOURCE_STAMP",
    "SPICE_STAGED_PATHS",
    "SPICE_VISIBLE_PROG",
    # Selected-tree tests receive these workspace-test fixture authorities.
    "SPICE_WORKSPACE_TEST_DESCENDANT_FIXTURE_ROOT",
    "SPICE_WORKSPACE_TEST_SHARED_OUTPUTS",
    "SPICE_WORKSPACE_TEST_WRITABLE_ROOT",
    "TMPDIR",
    "ZDOTDIR",
]

# Which files the shape arm measures lines and bytes over.
#
# Nothing packages a fallback for this. An arm offered no paths reports a clean
# family over nothing, which reads exactly like a repository that passed, so the
# selection is declared here or the document refuses to load. The inventory is
# the complete set Gate measures in this repository; a shorter list would not
# tighten the gate, it would silently stop measuring
# whatever it dropped.
[policy.file_shape]
source_suffixes = [
    ".astro", ".bash", ".c", ".cc", ".cjs", ".cpp", ".cs", ".css", ".cts",
    ".go", ".h", ".hpp", ".html", ".java", ".js", ".json", ".jsx", ".kt",
    ".less", ".lua", ".m", ".md", ".mjs", ".mm", ".mts", ".php", ".py",
    ".pyi", ".rb", ".rs", ".rst", ".sass", ".scala", ".scss", ".sh", ".sql",
    ".svelte", ".swift", ".toml", ".ts", ".tsx", ".txt", ".vue", ".xml",
    ".yaml", ".yml", ".zsh",
]

# Which files each language arm reads.
#
# These are two selections rather than one because they are genuinely different
# sets. `complexity` preserves the repository's routine-language selection; the
# compiled arm measures suffixes with a vendored grammar and names every other
# selected suffix as unsupported. `magic` compares literals against a baseline
# through a C-family grammar, and a language that grammar cannot parse exactly
# would have every literal in it read as a regression.
[policy.languages]
complexity = [
    ".c", ".cc", ".cpp", ".cs", ".go", ".h", ".hpp", ".java", ".js", ".kt",
    ".lua", ".m", ".mm", ".php", ".py", ".rb", ".rs", ".scala", ".swift",
    ".ts",
]
magic = [
    ".c", ".cc", ".cpp", ".cs", ".go", ".h", ".hpp", ".java", ".js", ".kt",
    ".m", ".mm", ".py", ".rs", ".scala", ".swift", ".ts",
]

[taste.polling]
words = ["delay", "delays", "delayed", "delaying", "poll", "polls", "polled", "polling", "sleep", "sleeps", "sleeping", "slept"]
message = "Respond to the real event, signal, or completion notification through a blocking call, watcher, or callback, or restructure the flow so nothing remains to await."

[taste.fallbacks]
words = ["fall back", "fall backs", "fallback", "fallbacks", "falls back"]
message = "Keep one deterministic path and let violated assumptions refuse immediately. Add a default or resolver order only when the contract names it."

[taste.compatibility]
words = ["compatible", "compatibility", "compatibilities", "compatibly"]
message = "Keep one tested, visible current path. Migrate retained data forward once or refuse naming its owning release; never accumulate release-specific execution arms."

[taste.shims]
words = ["shim", "shimmed", "shimming", "shims"]
message = "Replace the old shape outright, delete it, and route every caller to the current interface."

[taste.aliases]
words = ["alias", "aliases", "aliased", "aliasing"]
message = "Rename in place, update every reference in one change, and leave exactly one name."

[taste.legacy]
words = ["legacy", "legacies"]
message = "Treat old implementations as evidence, never as executable arms. Migrate retained data forward once or refuse naming its owning release."
