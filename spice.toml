# Tracked repository policy for the Rust port.
#
# This file carries intent only. It deliberately contains none of the
# predecessor's Python runtime configuration -- no wrapper argv, no pytest or
# release commands, no suite-seam paths, no interpreter-specific env allowlist.
# Those describe how a Python checkout runs itself; this repository builds a
# Rust workspace, and `cargo xtask verify` already owns its verification.

[tasks]
# Public scheduler stems beyond the packaged `task` and `serve` defaults.
# Product work routes directly by ownership so the allocator can retain domain
# locality instead of collapsing every crate under one `task` bucket.
#
# The dependency lattice owns the workspace inventory. Every product member is
# present below except `xtask`: it is the verification launcher for `gate`, not
# a second verification domain. `doctrine` owns settled repository law;
# `scheduler` owns the task-plane topology; `rim` owns the cross-crate command,
# exit, and environment edge; and `corpus` owns fixture bodies replayed across
# multiple crates.
#
# One sense keeps one name. Work formerly described as `release`, `studies`,
# `mail`, `lifecycle`, or `hooks` routes to its current owner (`dist`, `gate`,
# `steer`, or `lane`). `cli` and `tests` remain `rim` and `corpus`. Generic
# activity/history labels such as `docs`, `config`, `toolchain`, and `spec` do
# not become scheduler domains; they route to the organ whose contract moves.
stems = [
    "app",
    "atomic",
    "board",
    "bus",
    "canvas",
    "consent",
    "corpus",
    "dialect",
    "dist",
    "doctrine",
    "fold",
    "gate",
    "journal",
    "lane",
    "listen",
    "proof",
    "rim",
    "scheduler",
    "sill",
    "spice",
    "steer",
    "tape",
    "taste",
    "vendor",
    "wire",
]

# A stem names the domain that owns the work, never the work itself. Every
# project therefore takes a child segment saying what moves inside that domain,
# with a third available when a child needs to subdivide. A bare stem would let
# a domain accumulate rows that are distinguishable only by handle, which is the
# same undifferentiated bucket the stem inventory above exists to break up.
project_min_depth = 2
project_max_depth = 3

[policy]
# Every environment name this workspace defines, spelled once.
#
# This is not the predecessor's interpreter allowlist, which said which ambient
# values Python was permitted to read. This is the workspace's own vocabulary:
# the names spice writes and the names spice reads back. The gate matches it
# against the tracked tree in both directions, so a name used without being
# listed fails, and a name listed after its last use fails too. That is what
# makes the vocabulary countable rather than a set of literals accumulating
# across crates.
#
# `steer` owns the four hook/session names. Interception exports the proof and
# reads the geometry back: the hooks directory it sources its static stage
# from, the rendered direction it writes to stderr, and the lane a shell is
# bound to. `gate` owns the mutation seed and attempt number it repeats into
# every bounded cargo-mutants process.
env_names = [
    "SPICE_HOOKS",
    "SPICE_INBOX",
    "SPICE_LANE",
    "SPICE_MUTATION_ATTEMPT",
    "SPICE_MUTATION_SEED",
    "SPICE_PROOF",
]

[taste.polling]
words = ["delay*", "poll*", "sleep*", "slept"]
message = "Respond to the real event, signal, or completion notification through a blocking call, watcher, or callback, or restructure the flow so nothing remains to await."

[taste.fallbacks]
words = ["fall back", "fall backs", "fallback*", "falls back"]
message = "Keep one deterministic path and let violated assumptions refuse immediately. Add a default or resolver order only when the contract names it."

[taste.compatibility]
words = ["compatib*"]
message = "Keep one tested, visible current path. Migrate retained data forward once or refuse naming its owning release; never accumulate release-specific execution arms."

[taste.shims]
words = ["shim", "shimmed", "shimming", "shims"]
message = "Replace the old shape outright, delete it, and route every caller to the current interface."

[taste.aliases]
words = ["alias*"]
message = "Rename in place, update every reference in one change, and leave exactly one name."

[taste.legacy]
words = ["legac*"]
message = "Treat old implementations as evidence, never as executable arms. Migrate retained data forward once or refuse naming its owning release."
