# Tracked repository policy for Spice.
#
# Cutoff inventory for every executable value in spice-z's tracked
# `spice.toml`:
#
# - `wrappers.spice-dev.pre-commit.argv`: `gate::pre-commit`, exposed as
#   `spice dev pre-commit` and by the native pre-commit hook.
# - `wrappers.spice-dev.pytest.argv`: refused. It launches a Python-only test
#   runner; `xtask::verify` owns the native workspace tests without a wrapper.
# - `policy.pre_commit[0].run`: refused. The named script checks spice-z's
#   documentation set; native documentation policy is part of
#   `gate::pre-commit`.
# - `policy.suite_seam.run`: refused. Its Python import-reach seam and
#   `policy.suite_seam.paths` have no native subject; `xtask::verify` runs the
#   complete native suite.
# - `commands.release`: `dist::{release_notes,publish}` owns the native release
#   command surface, with proof artifacts supplied by `proof::seal`.
#
# No executable value above is retained in this document. Until the installed
# spice-z hook and config reader are stopped, declarations here remain comments:
# that reader reparses this file before every tool call, and a new executable
# key would require predecessor trust. After cutoff, executable declarations
# enter only through Spice's typed registry and native gate.

[tasks]
# Public scheduler stems beyond the packaged `task` and `serve` defaults.
# Product work routes directly by ownership so the allocator can retain domain
# locality instead of collapsing every crate under one `task` bucket.
#
# The dependency lattice owns the workspace inventory. Every product member is
# present below except `xtask`: it is the verification launcher for `gate`, not
# a second verification domain. `doctrine` owns settled repository law;
# `scheduler` owns the task-plane topology; `rim` owns the cross-crate command,
# exit, and environment edge; and `corpus` owns fixture bodies replayed across
# multiple crates.
#
# One sense keeps one name. Work formerly described as `release`, `studies`,
# `mail`, `lifecycle`, or `hooks` routes to its current owner (`dist`, `gate`,
# `steer`, or `lane`). `cli` and `tests` remain `rim` and `corpus`. Generic
# activity/history labels such as `docs`, `config`, `toolchain`, and `spec` do
# not become scheduler domains; they route to the organ whose contract moves.
stems = [
    "app",
    "atomic",
    "board",
    "bus",
    "canvas",
    "consent",
    "corpus",
    "dialect",
    "dist",
    "doctrine",
    "fold",
    "gate",
    "journal",
    "lane",
    "listen",
    "proof",
    "rim",
    "scheduler",
    "sill",
    "spice",
    "steer",
    "tape",
    "taste",
    "vendor",
    "wire",
]

# A stem names the domain that owns the work, never the work itself. Every
# project therefore takes a child segment saying what moves inside that domain,
# with a third available when a child needs to subdivide. A bare stem would let
# a domain accumulate rows that are distinguishable only by handle, which is the
# same undifferentiated bucket the stem inventory above exists to break up.
project_min_depth = 2
project_max_depth = 3

[policy]
# Every environment name this workspace defines, spelled once.
#
# This is not the predecessor's interpreter allowlist, which said which ambient
# values Python was permitted to read. This is the workspace's own vocabulary:
# the names spice writes and the names spice reads back. The gate matches it
# against the tracked tree in both directions, so a name used without being
# listed fails, and a name listed after its last use fails too. That is what
# makes the vocabulary countable rather than a set of literals accumulating
# across crates.
#
# Session forensics reads the live Codex or Claude identity and the selected
# agent vendor. `steer` owns the four hook/session names. Interception exports
# the proof and reads the geometry back: the hooks directory it sources its
# static stage from, the rendered direction it writes to stderr, and the lane
# a shell is bound to. `gate` owns the mutation seed and attempt number it
# repeats into every bounded cargo-mutants process. Its hygiene acquisition
# fixture passes the captured repository and interpreter-tripwire marker to an
# isolated copy of the current test process, and fixes `TMPDIR` at private
# writable scratch so that isolation remains valid on a read-only proof host.
#
# Four foreign environment names are admitted here. The installed pre-commit
# hook unsets Git's three local-environment names before it execs verify, and
# the hooks fixture exports exactly those three to prove the child sees none of
# them. The hygiene acquisition fixture fixes the fourth, `TMPDIR`, at its own
# writable scratch. Spice does not own these names, but its fixtures write them.
# The ledger accounts what the tree references rather than what it invented, so
# they are counted here. Their access waiver is a separate arm and does not
# account them; a waived name is still a name, and one written without being
# counted here is one nobody can find again. Doctor reports only the names Spice
# owns, so these seven are the difference wire pins between this manifest and
# SpiceVariable.
env_names = [
    "CLAUDE_CODE_SESSION_ID",
    "CODEX_THREAD_ID",
    "GIT_CONFIG_COUNT",
    "GIT_CONFIG_SYSTEM",
    "GIT_DIR",
    "GIT_EDITOR",
    "GIT_INDEX_FILE",
    "GIT_WORK_TREE",
    "SPICE_AGENT_VENDOR",
    "SPICE_HOOKS",
    "SPICE_HYGIENE_ACQUIRE_REPOSITORY",
    "SPICE_HYGIENE_INTERPRETER_MARKER",
    "SPICE_INBOX",
    "SPICE_INSTALL_TEST_PAUSE_ACTION",
    "SPICE_INSTALL_TEST_PAUSE_CONTROL",
    "SPICE_INSTALL_TEST_PAUSE_PATH",
    "SPICE_LANE",
    "SPICE_MUTATION_ATTEMPT",
    "SPICE_MUTATION_SEED",
    "SPICE_NATIVE_PINS",
    "SPICE_PROOF",
    "TMPDIR",
]

# Which files the shape arm measures lines and bytes over.
#
# Nothing packages a fallback for this. An arm offered no paths reports a clean
# family over nothing, which reads exactly like a repository that passed, so the
# selection is declared here or the document refuses to load. The inventory is
# the one the predecessor gate measures this same repository with today; a
# shorter list would not tighten the gate, it would silently stop measuring
# whatever it dropped.
[policy.file_shape]
source_suffixes = [
    ".astro", ".bash", ".c", ".cc", ".cjs", ".cpp", ".cs", ".css", ".cts",
    ".go", ".h", ".hpp", ".html", ".java", ".js", ".json", ".jsx", ".kt",
    ".less", ".lua", ".m", ".md", ".mjs", ".mm", ".mts", ".php", ".py",
    ".pyi", ".rb", ".rs", ".rst", ".sass", ".scala", ".scss", ".sh", ".sql",
    ".svelte", ".swift", ".toml", ".ts", ".tsx", ".txt", ".vue", ".xml",
    ".yaml", ".yml", ".zsh",
]

# Which files each language arm reads.
#
# These are two selections rather than one because they are genuinely different
# sets. `complexity` preserves the predecessor's routine-language selection; the
# native arm measures suffixes with a vendored grammar and names every other
# selected suffix as unsupported. `magic` compares literals against a baseline
# through a C-family grammar, and a language that grammar cannot parse exactly
# would have every literal in it read as a regression.
[policy.languages]
complexity = [
    ".c", ".cc", ".cpp", ".cs", ".go", ".h", ".hpp", ".java", ".js", ".kt",
    ".lua", ".m", ".mm", ".php", ".py", ".rb", ".rs", ".scala", ".swift",
    ".ts",
]
magic = [
    ".c", ".cc", ".cpp", ".cs", ".go", ".h", ".hpp", ".java", ".js", ".kt",
    ".m", ".mm", ".py", ".rs", ".scala", ".swift", ".ts",
]

[taste.polling]
words = ["delay*", "poll*", "sleep*", "slept"]
message = "Respond to the real event, signal, or completion notification through a blocking call, watcher, or callback, or restructure the flow so nothing remains to await."

[taste.fallbacks]
words = ["fall back", "fall backs", "fallback*", "falls back"]
message = "Keep one deterministic path and let violated assumptions refuse immediately. Add a default or resolver order only when the contract names it."

[taste.compatibility]
words = ["compatib*"]
message = "Keep one tested, visible current path. Migrate retained data forward once or refuse naming its owning release; never accumulate release-specific execution arms."

[taste.shims]
words = ["shim", "shimmed", "shimming", "shims"]
message = "Replace the old shape outright, delete it, and route every caller to the current interface."

[taste.aliases]
words = ["alias*"]
message = "Rename in place, update every reference in one change, and leave exactly one name."

[taste.legacy]
words = ["legac*"]
message = "Treat old implementations as evidence, never as executable arms. Migrate retained data forward once or refuse naming its owning release."
